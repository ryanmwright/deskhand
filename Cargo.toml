[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Deskhand contributors"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Internal crates
deskhand-core = { path = "crates/deskhand-core", version = "0.1.0" }
deskhand-mqtt = { path = "crates/deskhand-mqtt", version = "0.1.0" }
deskhand-common = { path = "crates/deskhand-common", version = "0.1.0" }
deskhand-linux = { path = "crates/deskhand-linux", version = "0.1.0", default-features = false }
deskhand-kde = { path = "crates/deskhand-kde", version = "0.1.0" }
deskhand-testkit = { path = "crates/deskhand-testkit", version = "0.1.0" }

# Runtime
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "time", "process", "fs", "sync", "net"] }
tokio-util = "0.7.20"
async-trait = "0.1.92"
bytes = "1.12"

# MQTT: rustls with the ring provider (aws-lc needs cmake/nasm)
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }

# D-Bus. Pinned to 5.x until ksni/ashpd support zbus 6 (see docs/v1-plan.md §3).
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

# Config, serialisation, paths
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1"
serde_ignored = "0.1.14"
humantime-serde = "1.1"
directories = "6.0"
sha2 = "0.11"

# Logging and errors
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
thiserror = "2.0.21"
anyhow = "1.0.104"

# Binary
clap = { version = "4.6", features = ["derive", "env"] }
inquire = "0.9.4"
mdns-sd = "0.21.6"
ksni = "0.3.7"
sd-notify = "0.5"

# Platform
sysinfo = "0.40.1"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
inotify = "0.11.5"
libpulse-binding = "2.30.1"

# Testing
insta = { version = "1.49", features = ["json", "redactions"] }
testcontainers = "0.28"
tempfile = "3.27"
assert_cmd = "2.2"

[profile.release]
lto = "thin"
strip = "debuginfo"
