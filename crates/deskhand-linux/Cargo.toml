[package]
name = "deskhand-linux"
description = "Shared freedesktop/Linux integrations for Deskhand (logind, MPRIS, UPower, BlueZ, ...)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["audio-pulse"]
audio-pulse = ["dep:libpulse-binding"]
hidpp = ["dep:hidpp"]

[dependencies]
async-trait.workspace = true
deskhand-common.workspace = true
deskhand-core.workspace = true
futures-util.workspace = true
hidpp = { workspace = true, optional = true }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
inotify.workspace = true
libpulse-binding = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
zbus.workspace = true

[dev-dependencies]
anyhow.workspace = true
async-channel.workspace = true
deskhand-core = { workspace = true, features = ["test-util"] }
deskhand-testkit.workspace = true
bytes.workspace = true
tempfile.workspace = true
tokio-util.workspace = true

# M5 spike probes (docs/dev/spikes.md). Run them inside the Plasma VM.
[[example]]
name = "mic_probe"
required-features = ["audio-pulse"]

[[example]]
name = "hidpp_probe"
required-features = ["hidpp"]

[lints]
workspace = true
