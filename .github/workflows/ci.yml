name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse-dev pkg-config dbus
      - uses: Swatinem/rust-cache@v2
      # DESKHAND_IT=1 enables the mosquitto container tests (Docker is available on GitHub runners).
      - run: cargo test --workspace --all-features
        env:
          DESKHAND_IT: "1"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  # A glibc binary for deploying to a desktop by hand (docs/dev/deploy-to-host.md).
  # Built on the oldest supported Ubuntu so it runs on older glibc versions too.
  release-binary:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p deskhand
      - name: Package
        id: package
        run: |
          name="deskhand-${GITHUB_REF_NAME//\//-}-$(uname -m)-linux-gnu"
          mkdir -p "dist/$name"
          cp target/release/deskhand LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          "dist/$name/deskhand" --version
          echo "glibc symbols needed: $(objdump -T target/release/deskhand | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 30
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --clobber

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#deskhand --print-build-logs
      - run: nix flake check --no-build
      - run: nix fmt -- --check flake.nix nix/*.nix
      # Evaluates the Plasma VM (building it needs ~17 GB; the nightly VM job comes in M13).
      - run: nix eval .#nixosConfigurations.plasma-vm.config.system.build.vm.drvPath
