# Deskhand config inside the Plasma VM (`just vm`): the dev broker runs on the host,
# which QEMU's user network exposes as 10.0.2.2.
[device]
name = "Deskhand Plasma VM"

[general]
log = "info,deskhand_mqtt=debug"

[mqtt]
host = "10.0.2.2"
username = "deskhand"
password = "deskhand-dev"

# A test unit for the systemd switch. Create it in the VM:
# ~/.config/systemd/user/deskhand-test.service with ExecStart=sleep infinity.
[integrations.systemd]
units = ["deskhand-test.service"]

# Also publish the HACS mqtt_media_player entity (M8 acceptance).
[integrations.media]
compat_mqtt_media_player = true
