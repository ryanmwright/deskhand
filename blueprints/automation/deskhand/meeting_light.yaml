blueprint:
  name: Deskhand – meeting light
  description: >
    Turns a light on while the computer is in a call (microphone in use for
    10 seconds, or camera on) and off afterwards. Uses Deskhand's `in_call`
    sensor.
  domain: automation
  source_url: https://github.com/ryanmwright/deskhand/blob/main/blueprints/automation/deskhand/meeting_light.yaml
  input:
    in_call:
      name: In call sensor
      description: The computer's "In call" binary sensor.
      selector:
        entity:
          filter:
            - integration: mqtt
              domain: binary_sensor
    light:
      name: Light
      selector:
        target:
          entity:
            - domain: light
    color:
      name: Colour while in a call
      default: [255, 0, 0]
      selector:
        color_rgb: {}

mode: restart

triggers:
  - trigger: state
    entity_id: !input in_call
    not_from: [unavailable, unknown]

actions:
  - if:
      - condition: state
        entity_id: !input in_call
        state: "on"
    then:
      - action: light.turn_on
        target: !input light
        data:
          rgb_color: !input color
    else:
      - action: light.turn_off
        target: !input light
